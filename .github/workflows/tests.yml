# Unit tests on every push / pull request (no database, no LLM needed).
# Integration and browser tests need a running stack: see tests/README.md.
name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            solo-pixi-essential/api/requirements.txt
            tests/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install API dependencies (for the FastAPI app tests)
        run: pip install -r solo-pixi-essential/api/requirements.txt -r tests/requirements.txt

      - name: Python unit tests
        run: python tests/test_unit.py

      - name: JavaScript module tests
        run: node --test tests/js/
