services:
  postgres:
    image: postgres:16-alpine
    container_name: pixi-test-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pixi_test
      POSTGRES_USER: pixi
      POSTGRES_PASSWORD: pixipass
    volumes:
      - pixi-pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixi -d pixi_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: pixi-test-api
    restart: unless-stopped
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    environment:
      DATABASE_URL: postgresql://pixi:pixipass@postgres/pixi_test
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./api/app.py:/app/app.py
      - ./module_log_parser.py:/app/module_log_parser.py
      - ./solo_pixi_dashboard.html:/app/solo_pixi_dashboard.html
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pixi-pgdata:
