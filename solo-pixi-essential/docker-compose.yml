services:
  postgres:
    image: postgres:16-alpine
    container_name: pixi-test-db
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=80
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=2GB
      - -c
      - min_wal_size=512MB
      - -c
      - random_page_cost=1.1
    environment:
      POSTGRES_DB: pixi_test
      POSTGRES_USER: pixi
      POSTGRES_PASSWORD: pixipass
    volumes:
      - pixi-pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
        - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixi -d pixi_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 60s
    shm_size: "256m"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  api:
    build: ./api
    container_name: pixi-test-api
    restart: unless-stopped
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--timeout-keep-alive", "30", "--backlog", "2048"]
    environment:
      DATABASE_URL: postgresql://pixi:pixipass@postgres/pixi_test
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./api/app.py:/app/app.py
      - ./module_log_parser.py:/app/module_log_parser.py
      - ./ai_summary_helper.py:/app/ai_summary_helper.py
      - ./solo_pixi_dashboard.html:/app/solo_pixi_dashboard.html
    expose:
      - "8000"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: pixi-test-nginx
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  pixi-pgdata:
