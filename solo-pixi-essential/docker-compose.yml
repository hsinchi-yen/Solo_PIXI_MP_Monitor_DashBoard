# Solo PIXI MP Monitor Dashboard
#   docker compose up -d --build            production (code baked into the api image)
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#                                           development (source mounted; restart api after edits)
# Settings come from .env next to this file (template: .env.example).
services:
  postgres:
    image: postgres:16-alpine
    container_name: ${PIXI_PREFIX:-pixi-test}-db
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=80
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=2GB
      - -c
      - min_wal_size=512MB
      - -c
      - random_page_cost=1.1
      - -c
      - log_min_duration_statement=2000
    environment:
      POSTGRES_DB: pixi_test
      POSTGRES_USER: pixi
      POSTGRES_PASSWORD: pixipass
    volumes:
      - pixi-pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      # The desktop Log Uploader writes to the database directly on this port.
      - "${PIXI_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixi -d pixi_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 60s
    shm_size: "256m"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: pixi-dashboard-api:${APP_VERSION:-3.0.0}
    container_name: ${PIXI_PREFIX:-pixi-test}-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://pixi:pixipass@postgres/pixi_test
      APP_VERSION: ${APP_VERSION:-3.0.0}
      APP_TZ: ${APP_TZ:-Asia/Taipei}
      TZ: ${APP_TZ:-Asia/Taipei}
      TWEAK_USER: ${TWEAK_USER:-pixi}
      TWEAK_PASS: ${TWEAK_PASS:-pixipass}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      LLM_API_BASE: ${LLM_API_BASE:-http://10.20.30.23:8000/v1}
      LLM_API_KEY: ${LLM_API_KEY:-tn8227}
      LLM_MODEL: ${LLM_MODEL:-Qwen3.8-27B-UD-Q6_K_L}
      LLM_ENABLE_THINKING: ${LLM_ENABLE_THINKING:-false}
      LLM_REPORT_MAX_TOKENS: ${LLM_REPORT_MAX_TOKENS:-1536}
      STATS_REFRESH_SEC: ${STATS_REFRESH_SEC:-300}
      REPORT_AUTO: ${REPORT_AUTO:-true}
      REPORT_DAILY_AT: ${REPORT_DAILY_AT:-18:00}
      DB_POOL_MAX: ${DB_POOL_MAX:-8}
      UPLOAD_TMP_DIR: /tmp/pixi_uploads
    volumes:
      # Zips between analyze and commit; shared by both workers, kept across restarts.
      - pixi-uploads:/tmp/pixi_uploads
    expose:
      - "8000"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: ${PIXI_PREFIX:-pixi-test}-nginx
    restart: unless-stopped
    ports:
      - "${PIXI_HTTP_PORT:-8001}:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  pixi-pgdata:
  pixi-uploads:
