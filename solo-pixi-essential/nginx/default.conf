# Solo PIXI dashboard: static web app from ./web, API proxied to the api service.
upstream pixi_api {
    # No upstream keepalive: with it, small API responses stalled ~40 ms (Nagle / delayed ACK),
    # measured 28 of 30 requests; without it 0 of 30.
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/x-ndjson text/markdown text/plain image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # ── Static web app ──
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;         # revalidate (ETag) — new code shows up after deploy
        add_header X-Content-Type-Options nosniff always;
    }
    location /vendor/ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;   # versioned file names
        add_header X-Content-Type-Options nosniff always;
    }

    # ── API ──
    location /api/ {
        proxy_pass http://pixi_api;
        include /etc/nginx/conf.d/proxy_common.inc;
        proxy_read_timeout 120s;
    }
    location ~ ^/(health|docs|redoc|openapi\.json)$ {
        proxy_pass http://pixi_api;
        include /etc/nginx/conf.d/proxy_common.inc;
    }

    # Zip upload: large bodies, streamed to the API.
    location = /api/log-upload/analyze {
        proxy_pass http://pixi_api;
        include /etc/nginx/conf.d/proxy_common.inc;
        client_max_body_size 512m;
        client_body_timeout 300s;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
    # NDJSON streams (upload progress, AI chat, AI report): no buffering, long reads.
    location ~ ^/api/(log-upload/(commit|chat)|reports/[^/]+/(generate|ask))$ {
        proxy_pass http://pixi_api;
        include /etc/nginx/conf.d/proxy_common.inc;
        proxy_buffering off;
        proxy_read_timeout 300s;
        gzip off;
    }
}
